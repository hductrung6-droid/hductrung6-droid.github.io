<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vô Mệnh — Kẻ Không Thuộc Luân Hồi</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#09090b;
    color:#f5f5f5;
    font-family:Arial,sans-serif;
}

.hero{
    min-height:70vh;
    display:flex;
    align-items:flex-end;
    padding:30px 22px;
    background:
        radial-gradient(circle at 50% 25%,#55141b 0%,#1b0c0f 35%,#09090b 75%);
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.hero h1{
    margin:0;
    font-family:Georgia,serif;
    font-size:clamp(48px,14vw,90px);
    letter-spacing:8px;
}

.subtitle{
    margin-top:10px;
    color:#b8b8bd;
    letter-spacing:3px;
    font-size:14px;
}

section{
    padding:30px 20px;
}

.section-title{
    font-family:Georgia,serif;
    font-size:28px;
    margin-bottom:18px;
}

.chapter{
    display:block;
    text-decoration:none;
    color:white;
    background:#17171b;
    border:1px solid #29292f;
    border-radius:12px;
    padding:18px;
    margin:12px 0;
    transition:.2s;
}

.chapter:hover{
    background:#222228;
    transform:translateY(-2px);
}

.chapter-title{
    font-size:18px;
    font-weight:bold;
}

.chapter-info{
    color:#888;
    margin-top:6px;
    font-size:14px;
}

.about{
    color:#b8b8bd;
    line-height:1.8;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<div class="hero">
    <div class="container">
        <h1>VÔ MỆNH</h1>
        <div class="subtitle">
            KẺ KHÔNG THUỘC LUÂN HỒI
        </div>
    </div>
</div>
<div style="text-align:center; padding:25px 20px;">
    <img src="https://raw.githubusercontent.com/hductrung6-droid/hductrung6-droid.github.io/main/file_000000001de8820889c6bd6697aeaca9.png"
         style="width:100%; max-width:500px; border-radius:15px;"
         alt="Poster Vô Mệnh">
</div>
<section class="container">

    <div class="section-title">
        Danh sách chương
    </div>

    <a class="chapter" href="#">
        <div class="chapter-title">Chương 1</div>
        <div class="chapter-info">Đang cập nhật</div>
    </a>

    <a class="chapter" href="#">
        <div class="chapter-title">Chương 2</div>
        <div class="chapter-info">Đang cập nhật</div>
    </a>

</section>

<section class="container">

    <div class="section-title">
        Về Vô Mệnh
    </div>

    <div class="about">
        Một câu chuyện tu tiên về những kẻ bước ra
        ngoài vòng luân hồi.
        <br><br>
        Website được tạo riêng để bạn bè có thể đọc
        《Vô Mệnh – Kẻ Không Thuộc Luân Hồi》 miễn phí.
    </div>

</section>

<footer>
    © Vô Mệnh — Kẻ Không Thuộc Luân Hồi
</footer>

</body>
</html>
